<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Galactic Dash - Orbit Loxley</title>

                      "on-tertiary-container": "#4c3e00",
                      "inverse-on-surface": "#f4f0e8",
                      "surface-container-highest": "#e6e2d9",
                      "on-secondary-fixed": "#001e2b",
                      "inverse-primary": "#ffb3b5",
                      "primary-container": "#da314b",
                      "on-error-container": "#93000a",
                      "secondary": "#006687",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#1c1c17",
                      "tertiary-fixed": "#ffe173",

                      "on-primary-fixed": "#40000b",
                      "surface-container": "#f1eee5",
                      "on-secondary-fixed-variant": "#004d66",
                      "surface": "#fdf9f0",
                      "on-surface-variant": "#5b4041",
                      "tertiary-container": "#caa800",
                      "surface-container-high": "#ece8df",
                      "tertiary-fixed-dim": "#e8c426",
                      "on-tertiary-fixed": "#221b00",
                      "tertiary": "#705d00",
                      "inverse-surface": "#31312b",
                      "background": "#fdf9f0",
                      "secondary-fixed": "#c1e8ff",
                      "on-primary-fixed-variant": "#920025",
                      "surface-dim": "#dddad1",
                      "surface-container-low": "#f7f3ea",
                      "on-tertiary-fixed-variant": "#554500",
                      "surface-tint": "#ba1537",
                      "on-secondary-container": "#005572",
                      "surface-container-lowest": "#ffffff",
                      "error": "#ba1a1a",
                      "secondary-container": "#5fcdff",
                      "on-error": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "safe-area": "32px",
                      "gutter": "16px",
                      "container-padding": "24px",
                      "unit": "8px"
              },
              "fontFamily": {
                      "display-xl-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "body-lg": [
                              "Be Vietnam Pro"
                      ],
                      "display-xl": [

                      ],
                      "headline-sm": [

                      ],
                      "headline-md": [

          },
        }

<style>
        .glossy-button {
            background: linear-gradient(180deg, theme('colors.primary') 0%, theme('colors.primary-fixed-dim') 100%);
            box-shadow: 0 6px 0 theme('colors.on-primary-fixed-variant'), 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }
        .glossy-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 9999px;
        }
        .glossy-button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 theme('colors.on-primary-fixed-variant'), 0 2px 5px -1px rgba(0, 0, 0, 0.2);
        }

        .hud-panel {
            background: linear-gradient(135deg, theme('colors.surface-container-highest') 0%, theme('colors.surface-variant') 100%);
            border: 4px solid theme('colors.on-surface-variant');
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.5), 0 8px 0 theme('colors.on-surface-variant');
            border-radius: theme('borderRadius.lg');
            position: relative;
        }
        
        .hud-panel::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 12px;
            background: theme('colors.secondary-container');
            border-radius: 6px 6px 0 0;
            border: 4px solid theme('colors.on-surface-variant');
            border-bottom: none;
        }

        .bubbly-bar-container {
            background: theme('colors.surface-container-high');
            border: 4px solid theme('colors.on-surface-variant');
            border-radius: theme('borderRadius.full');
            padding: 4px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .bubbly-bar-fill {
            background: linear-gradient(90deg, theme('colors.secondary') 0%, theme('colors.secondary-container') 100%);
            border-radius: theme('borderRadius.full');
            position: relative;
            transition: width 0.3s ease;
        }

        .bubbly-bar-fill::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            border-radius: theme('borderRadius.full');
        }

        .stars-bg {
            background-color: #0b1021;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                              radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                              radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px),
                              radial-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1) 2px, transparent 30px);
            background-size: 550px 550px, 350px 350px, 250px 250px, 150px 150px;
            background-position: 0 0, 40px 60px, 130px 270px, 70px 100px;
            animation: moveStars 60s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0, 40px 60px, 130px 270px, 70px 100px; }
            to { background-position: -550px 0, -310px 60px, -120px 270px, -80px 100px; }
        }

        .supercharge-fill {
            background: linear-gradient(90deg, theme('colors.tertiary') 0%, theme('colors.tertiary-container') 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen overflow-hidden flex flex-col">
<!-- Top Navigation (Shell) -->
<nav class="hidden md:flex justify-between items-center w-full px-safe py-gutter max-w-7xl mx-auto bg-background/80 backdrop-blur-md text-primary font-display-xl text-display-xl tracking-tight docked full-width top-0 border-b-4 border-surface-container-highest shadow-sm z-50">
<div class="font-bold">Orbit Loxley</div>
<div class="flex items-center gap-4">
<button class="hover:scale-105 transition-transform text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
<button class="hover:scale-105 transition-transform text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</nav>
<!-- Main Game Canvas -->
<main class="flex-1 relative stars-bg overflow-hidden flex items-center justify-center">
<!-- Background Elements -->
<div class="absolute inset-0 opacity-40 pointer-events-none" style="background: radial-gradient(circle at 70% 30%, theme('colors.primary-fixed-dim'), transparent 40%), radial-gradient(circle at 20% 80%, theme('colors.secondary-fixed-dim'), transparent 50%); mix-blend-mode: screen;"></div>
<!-- HUD Layer -->
<div class="absolute top-safe-area left-safe-area right-safe-area flex justify-between items-start z-20 pointer-events-none">
<!-- Left HUD: Level & Score -->
<div class="hud-panel p-4 flex flex-col gap-2 min-w-[180px]">
<div class="flex items-center justify-between">
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase">Lvl 3</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">Galactic Dash</span>
</div>
<div class="flex items-center gap-2 bg-surface-container-lowest p-2 rounded-lg border-2 border-surface-variant">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-display-lg text-display-lg font-extrabold text-on-surface tracking-tighter">14,250</span>
</div>
</div>
<!-- Right HUD: Fuel & Supercharge -->
<div class="hud-panel p-4 flex flex-col gap-4 min-w-[220px]">
<!-- Fuel Bar -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center px-1">
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase">Fuel</span>
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1; font-size: 16px;">local_fire_department</span>
</div>
<div class="bubbly-bar-container h-6">
<div class="bubbly-bar-fill h-full w-[75%] relative">
<!-- Handle/Indicator -->
<div class="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-secondary-container border-2 border-on-surface-variant rounded-full shadow-sm flex items-center justify-center">
<div class="w-2 h-2 bg-white rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Super-Charge Bar -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center px-1">
<span class="font-label-bold text-label-bold text-tertiary uppercase">Super-Charge</span>
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1; font-size: 16px;">bolt</span>
</div>
<div class="bubbly-bar-container h-8 border-tertiary-container bg-tertiary-fixed">
<div class="bubbly-bar-fill supercharge-fill h-full w-[40%] relative">
<!-- Glowing effect when charging -->
<div class="absolute inset-0 bg-white opacity-20 animate-pulse rounded-full"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Central Action Area -->
<div class="relative w-full max-w-4xl h-[60vh] flex items-center justify-center perspective-1000">
<!-- Obstacles (Visual representation) -->
<div class="absolute right-10 top-1/4 w-4 h-32 bg-primary-fixed-dim rounded-full shadow-[0_0_15px_theme('colors.primary')] animate-pulse opacity-80" style="transform: skewX(-15deg);"></div>
<div class="absolute right-40 bottom-1/4 w-4 h-48 bg-secondary-fixed-dim rounded-full shadow-[0_0_15px_theme('colors.secondary')] animate-pulse opacity-60" style="transform: skewX(-15deg);"></div>
<!-- Character -->
<div class="relative z-10 animate-bounce" style="animation-duration: 2s;">
<img class="w-64 h-auto drop-shadow-2xl object-contain" data-alt="A 3D render of a cute, kawaii-style mascot character named Loxley wearing a futuristic pink spacesuit and jetpack, flying horizontally against a deep space background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEr7DOENq3Go6Z7QiD89wwwD5mAiOll3YExwYODk480hgaJ_eGjsVKU-kCvD3waglZ-caVnk5DuCXusE7P8wfGomCnfZDrg7y5F4MLqDG56f5T_m_ro7BtH0vCkPfbli66AiCKNJAJZVzJDsivDVmbPdU72ugGeMoe75R4BoJAcqag0db9HlvRSKuVUn4r7ubGRlyEPhgeFR53nv412r7TNAm-zoML2Ll_sqlKjXj7hQmD3ukFKdJDxLPSinsAIMuubcQ"/>
<!-- Thrust Effect -->
<div class="absolute top-1/2 -left-20 w-32 h-16 bg-gradient-to-r from-transparent via-secondary-container to-white rounded-full blur-md opacity-70 transform -translate-y-1/2" style="animation: pulseThrust 0.5s infinite alternate;"></div>
</div>
</div>
<!-- Bottom Controls (Mobile/Touch) -->
<div class="absolute bottom-safe-area left-0 right-0 flex justify-center gap-8 z-20 px-gutter">
<button class="glossy-button w-24 h-24 rounded-full flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-size: 48px; font-variation-settings: 'FILL' 1;">arrow_upward</span>
</button>
<button class="glossy-button w-24 h-24 rounded-full flex items-center justify-center text-on-primary bg-tertiary-container border-b-tertiary">
<span class="material-symbols-outlined" style="font-size: 48px; font-variation-settings: 'FILL' 1;">rocket_launch</span>
</button>
<button class="glossy-button w-24 h-24 rounded-full flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-size: 48px; font-variation-settings: 'FILL' 1;">arrow_downward</span>
</button>
</div>
</main>
<!-- Bottom Navigation (Shell - Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-end px-gutter pb-safe pt-unit bg-surface-container-lowest text-primary font-label-bold text-label-bold docked full-width rounded-t-lg border-t-4 border-surface-container-highest shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 opacity-70 hover:opacity-100 hover:scale-105">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
            Home
        </button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-6 py-2 scale-110 -translate-y-2 shadow-md transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
            Mini Games
        </button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 opacity-70 hover:opacity-100 hover:scale-105">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">leaderboard</span>
            Leaderboard
        </button>
</nav>
<style>
        @keyframes pulseThrust {
            0% { transform: translateY(-50%) scaleX(0.9); opacity: 0.5; }
            100% { transform: translateY(-50%) scaleX(1.1); opacity: 0.9; }
        }
    </style>
</body></html>

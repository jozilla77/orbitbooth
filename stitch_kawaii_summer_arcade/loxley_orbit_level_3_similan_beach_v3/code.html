<style>
        .glossy-button {
            background: linear-gradient(180deg, theme('colors.primary') 0%, theme('colors.primary-fixed-dim') 100%);
            box-shadow: 0 6px 0 theme('colors.on-primary-fixed-variant'), 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.1s ease;
        }
        .glossy-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 9999px;
        }
        .glossy-button:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 theme('colors.on-primary-fixed-variant'), 0 2px 5px -1px rgba(0, 0, 0, 0.2);
        }

        .hud-panel {
            background: linear-gradient(135deg, theme('colors.surface-container-highest') 0%, theme('colors.surface-variant') 100%);
            border: 4px solid theme('colors.on-surface-variant');
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.5), 0 8px 0 theme('colors.on-surface-variant');
            border-radius: theme('borderRadius.lg');
            position: relative;
        }
        
        .hud-panel::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 12px;
            background: theme('colors.secondary-container');
            border-radius: 6px 6px 0 0;
            border: 4px solid theme('colors.on-surface-variant');
            border-bottom: none;
        }

        .bubbly-bar-container {
            background: theme('colors.surface-container-high');
            border: 4px solid theme('colors.on-surface-variant');
            border-radius: theme('borderRadius.full');
            padding: 4px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .bubbly-bar-fill {
            background: linear-gradient(90deg, theme('colors.secondary') 0%, theme('colors.secondary-container') 100%);
            border-radius: theme('borderRadius.full');
            position: relative;
            transition: width 0.3s ease;
        }

        .bubbly-bar-fill::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            border-radius: theme('borderRadius.full');
        }

        .bg-scrolling {
            background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLsH1isTuG2XXcj2twdb8Wz0n1ixFCge3caBds_ojsGAqCd6nqBt5o_0IhQqKOW3zCqSPHdHilCZ-1Eb15W9OMqPJy3R5gUKo12dIAO_4a-_zc5WocUOGnbztlmvKHUz-hGk04s1QGv-eh85qBGdUBcsulw-G8o4bNC2lfiyKoLfzwNTscxAZ2Fb7dfOMk5KsG7m3jWht6yY9F2oWHmW3cGTns-oEtTJ7kwWns0e2mdG_dg75nkmkVPGsuU');
            background-size: auto 100%;
            background-position: center;
            background-repeat: repeat-x;
            animation: moveBackground 6.66s linear infinite; /* 3x faster than 20s */
        }

        @keyframes moveBackground {
            from { background-position: 0 center; }
            to { background-position: -100vw center; }
        }

        .supercharge-fill {
            background: linear-gradient(90deg, theme('colors.tertiary') 0%, theme('colors.tertiary-container') 100%);
        }

        .obstacle-move {
            animation: moveObstacle 1.33s linear infinite; /* 3x faster than 4s */
        }

        @keyframes moveObstacle {
            from { right: -20%; }
            to { right: 120%; }
        }

        .jump-animation {
            animation: jump 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes jump {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-80px) rotate(-15deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('game-canvas');
        const character = document.getElementById('character-container');
        const jetBlast = document.getElementById('jet-blast');
        let yPos = 0;
        let velocity = 0;
        const gravity = 0.8;
        const jumpStrength = -12;
        let isPlaying = true;

        function updatePhysics() {
            if (!isPlaying) return;
            velocity += gravity;
            yPos += velocity;
            
            // Basic boundaries
            if (yPos > 200) yPos = 200; // Floor
            if (yPos < -200) yPos = -200; // Ceiling
            
            character.style.transform = `translateY(${yPos}px) rotate(${velocity * 1.5}deg)`;
            requestAnimationFrame(updatePhysics);
        }

        function jump() {
            velocity = jumpStrength;
            
            // Jet blast animation
            jetBlast.style.opacity = '0.9';
            jetBlast.style.transform = 'translateY(-50%) scaleX(1.5)';
            
            setTimeout(() => {
                jetBlast.style.opacity = '0';
                jetBlast.style.transform = 'translateY(-50%) scaleX(0)';
            }, 300);
        }

        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        // Start physics loop
        updatePhysics();
    });
</script>

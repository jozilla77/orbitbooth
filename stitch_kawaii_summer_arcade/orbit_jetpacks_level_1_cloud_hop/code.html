<style>
        body {
            background: linear-gradient(180deg, #c1e8ff 0%, #fdf9f0 100%);
            min-height: 100vh;
            overflow: hidden; /* Lock scroll for game feel */
        }

        /* Tactile & Glossy Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 8px 32px rgba(0, 102, 135, 0.1),
                inset 0 4px 0 rgba(255, 255, 255, 0.5);
        }

        .glossy-btn {
            position: relative;
            background: #da314b;
            border-bottom: 6px solid #920025;
            transition: all 0.1s ease;
        }
        .glossy-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 999px;
        }
        .glossy-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .bubbly-bar {
            background: #ece8df;
            border-radius: 999px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .bubbly-fill {
            background: linear-gradient(90deg, #5fcdff 0%, #73d1ff 100%);
            border-radius: 999px;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.4);
            height: 100%;
            width: 75%; /* Example fill */
        }

        .cloud-shape {
            position: absolute;
            background: #ffffff;
            border-radius: 999px;
            opacity: 0.8;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.05));
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes scrollBg {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .animate-scroll { animation: scrollBg 20s linear infinite; }
    </style>

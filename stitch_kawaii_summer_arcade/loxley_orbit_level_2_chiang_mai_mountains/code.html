<style>
        body {

        }
        
        .glossy-btn {
            position: relative;
            box-shadow: 0 6px 0 var(--tw-shadow-color);

        .glossy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--tw-shadow-color);
        }
        .glossy-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
            border-radius: 9999px;
            pointer-events: none;

        .hud-panel {
            background-color: rgba(253, 249, 240, 0.85);
            backdrop-filter: blur(8px);

        }

        @keyframes scrollBackground {
            from { background-position: 0 0; }
            to { background-position: -200% 0; }
        }

        .scrolling-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC61dM3Xs8LtyMq-AaS5nPFR65B9WLI80rlFOx4HswE8iD_VKmKLDUwd30jZ6ARZ1-q2lGKNS5qqml5HUXsoR41PhSUbZXK0mq2P5nvcyJAS1udFGJnz-FS3xtm-DzGjXIeI7V0eNuDu6KrJlNqZz2Sf4wF0YTQkiEBpkLoPhz8OkOldIywZhJFRRmTMgDqccV_qJk9RJnXiGXX8Nh_dpgBaO-ii7M8QKjxdWVfrJHrOsmRKR1bd1f3og');
            background-size: auto 100%;
            background-repeat: repeat-x;
            animation: scrollBackground 10s linear infinite; /* 2x Speed */
            z-index: -1;
        }

        @keyframes moveObstacleFast {
            from { left: 100%; }
            to { left: -20%; }
        }

        .obstacle-anim {
            animation: moveObstacleFast 2.5s linear infinite; /* 2x Speed */
        }

        /* Jetpack flame */
        @keyframes flicker {
            0% { transform: scaleY(1); opacity: 0.8; }
            50% { transform: scaleY(1.4); opacity: 1; }
            100% { transform: scaleY(1); opacity: 0.8; }
        }
        .flame {
            animation: flicker 0.1s infinite alternate;
            transition: transform 0.15s ease-out;
        }

            transform: scaleY(2) !important;

<h1 class="font-display-xl-mobile text-on-surface-variant text-center mt-unit">Chiang Mai Mountains</h1>
<div class="mt-8 bg-surface-container-highest px-8 py-4 rounded-full border-4 border-outline-variant animate-pulse">
<span class="font-headline-sm text-on-surface">Dodge the pagodas!</span>
</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('level-intro');
                if(intro) {
                    intro.style.opacity = '0';
                    setTimeout(() => intro.remove(), 1000);
                }
            }, 2000);

            // Flappy Bird Mechanic
            const player = document.getElementById('player-character');
            const flame1 = document.getElementById('jet-flame-1');
            const flame2 = document.getElementById('jet-flame-2');
            
            let yPos = window.innerHeight / 2;
            let velocity = 0;
            const gravity = 0.6;
            const jump = -10;
            
            function flap() {
                velocity = jump;
                // Jet blast animation
                flame1.classList.add('flame-blast');
                flame2.classList.add('flame-blast');
                setTimeout(() => {
                    flame1.classList.remove('flame-blast');
                    flame2.classList.remove('flame-blast');
                }, 150);
            }

            // Bind controls
            document.addEventListener('mousedown', flap);
            document.addEventListener('touchstart', flap);
            document.addEventListener('keydown', (e) => { if(e.code === 'Space') flap(); });
            document.getElementById('flap-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                flap();
            });
            document.getElementById('flap-btn').addEventListener('touchstart', (e) => {
                e.stopPropagation();
                flap();
            });

            function gameLoop() {
                velocity += gravity;
                yPos += velocity;
                
                const maxBottom = window.innerHeight - player.offsetHeight / 2;
                if (yPos > maxBottom) {
                    yPos = maxBottom;
                    velocity = 0;
                }
                if (yPos < player.offsetHeight / 2) {
                    yPos = player.offsetHeight / 2;
                    velocity = 0;
                }
                
                player.style.top = yPos + 'px';
                
                // Tilt character based on velocity
                let rotation = Math.min(Math.max(velocity * 2, -25), 40);
                player.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
                
                requestAnimationFrame(gameLoop);
            }
            gameLoop();
        });
    </script>

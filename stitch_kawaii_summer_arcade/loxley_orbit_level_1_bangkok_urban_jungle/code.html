        /* Tactile & Glossy Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow:

        .glossy-btn {
            position: relative;
            background: #da314b;
            border-bottom: 6px solid #920025;
            transition: all 0.1s ease;
        }
        .glossy-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 999px;
        }
        .glossy-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* Animations */
        @keyframes scrollBg {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .animate-scroll { animation: scrollBg 20s linear infinite; }

        @keyframes jetBlast {
            0% { transform: scale(0.5) translateY(0); opacity: 1; }
            50% { transform: scale(1.2) translateY(10px); opacity: 0.8; }
            100% { transform: scale(0.2) translateY(30px); opacity: 0; }
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: jetBlast 0.5s ease-out forwards;
        }

        .obstacle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 60px;
            background: repeating-linear-gradient(
                45deg,
                #333,
                #333 10px,
                #222 10px,
                #222 20px
            );
            border: 2px solid #111;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .obstacle-gap {
            position: absolute;
            width: 100%;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

<!-- Game Logic -->
<script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const obstaclesLayer = document.getElementById('obstacles-layer');
        const jumpBtn = document.getElementById('jump-btn');
        const jetNozzle = document.getElementById('jet-nozzle');
        
        let playerY = window.innerHeight / 2;
        let velocity = 0;
        const gravity = 0.5;
        const jumpStrength = -9;
        let gameActive = true;
        let frame = 0;

        // Physics Loop
        function gameLoop() {
            if (!gameActive) return;

            velocity += gravity;
            playerY += velocity;

            // Floor/Ceiling collision
            if (playerY > window.innerHeight - 60) {
                playerY = window.innerHeight - 60;
                velocity = 0;
            }
            if (playerY < 60) {
                playerY = 60;
                velocity = 0;
            }

            // Apply rotation based on velocity for visual flair
            const rotation = Math.min(Math.max(velocity * 3, -25), 45);
            player.style.transform = `translateY(${playerY}px) rotate(${rotation}deg)`;

            // Spawn obstacles
            if (frame % 150 === 0) {
                spawnObstacle();
            }
            moveObstacles();

            frame++;
            requestAnimationFrame(gameLoop);
        }

        // Action
        function jump() {
            if (!gameActive) return;
            velocity = jumpStrength;
            createJetBlast();
        }

        function createJetBlast() {
            const colors = ['bg-yellow-400', 'bg-orange-500', 'bg-red-600', 'bg-gray-300'];
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 15 + 10;
                
                particle.className = `particle ${color}`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${(Math.random() - 0.5) * 30}px`;
                particle.style.top = `${(Math.random() * 10)}px`;
                
                jetNozzle.appendChild(particle);
                
                setTimeout(() => particle.remove(), 500);
            }
        }

        // Obstacles (Temple Spires / Powerlines abstract)
        const obstacles = [];
        function spawnObstacle() {
            const gapSize = 250;
            const minHeight = 100;
            const maxHeight = window.innerHeight - gapSize - minHeight;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;

            const obs = document.createElement('div');
            obs.className = 'obstacle';
            obs.style.left = `${window.innerWidth}px`;

            const gap = document.createElement('div');
            gap.className = 'obstacle-gap';
            gap.style.top = `${topHeight}px`;
            gap.style.height = `${gapSize}px`;

            obs.appendChild(gap);
            obstaclesLayer.appendChild(obs);
            obstacles.push({ el: obs, x: window.innerWidth });
        }

        function moveObstacles() {
            const speed = 4; // Normal speed 1x
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= speed;
                obs.el.style.left = `${obs.x}px`;

                if (obs.x < -100) {
                    obs.el.remove();
                    obstacles.splice(i, 1);
                }
            }
        }

        // Inputs
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });
        gameContainer.addEventListener('mousedown', jump);
        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        jumpBtn.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            jump();
        });
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            jump();
        });

        // Start
        requestAnimationFrame(gameLoop);
    </script>

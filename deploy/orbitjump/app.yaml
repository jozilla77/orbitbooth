runtime: go126
service: orbitjump
env: standard

# Go app root package (handles /orbitjump/api/*)
main: ./

# Scale to zero when idle
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

handlers:
  # API -> Go application (leaderboard read/write against Firestore)
  - url: /orbitjump/api/.*
    script: auto
    secure: always

  # Static game assets (served by the App Engine frontend, no instance needed).
  # NOTE: audio types (mp3/m4a/ogg/wav) MUST be here or the background music
  # 404s on App Engine even though it works under the local file server.
  - url: /orbitjump/(.*\.(js|html|css|png|jpg|jpeg|gif|svg|json|ico|wasm|woff2?|mp3|m4a|ogg|wav))$
    static_files: public/\1
    upload: public/.*\.(js|html|css|png|jpg|jpeg|gif|svg|json|ico|wasm|woff2?|mp3|m4a|ogg|wav)$
    secure: always

  # /orbitjump and /orbitjump/ -> the game
  - url: /orbitjump/?
    static_files: public/index.html
    upload: public/index.html
    secure: always
